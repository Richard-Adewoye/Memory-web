<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3" />
  <!-- Layered Flashcards Symbol -->
  <g transform="translate(256, 260) scale(0.95)" filter="url(#glow)">
    <!-- Back Card -->
    <rect x="-140" y="-120" width="280" height="190" rx="20" fill="#1e293b" stroke="#475569" stroke-width="3" transform="rotate(-8)" opacity="0.6" />
    <!-- Middle Card -->
    <rect x="-140" y="-120" width="280" height="190" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="3" transform="rotate(4)" opacity="0.85" />
    <!-- Front Active Card -->
    <rect x="-140" y="-100" width="280" height="190" rx="20" fill="url(#primary)" stroke="#60a5fa" stroke-width="4" />
    <!-- Brain / Synapse Wave in Card -->
    <path d="M-90 -10 Q-50 -60 0 -10 T90 -10" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <circle cx="-90" cy="-10" r="10" fill="#fbbf24" />
    <circle cx="0" cy="-10" r="12" fill="#38bdf8" />
    <circle cx="90" cy="-10" r="10" fill="#f43f5e" />
    <!-- Spaced Repetition Cadence Indicators -->
    <rect x="-90" y="30" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <rect x="-30" y="30" width="80" height="8" rx="4" fill="#fbbf24" />
    <rect x="60" y="30" width="30" height="8" rx="4" fill="#a7f3d0" />
    <!-- Golden Lightning Spark -->
    <path d="M12 -90 L-10 -40 L5 -40 L-12 10 L25 -30 L10 -30 Z" fill="url(#accent)" />
  </g>
</svg>